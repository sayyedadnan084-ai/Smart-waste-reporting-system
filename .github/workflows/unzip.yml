name: Extract CleanCity Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q CleanCity_Real_Online.zip -d extracted
          cp -r extracted/CleanCity_Real_Online/. .
          rm -rf extracted
          rm -f CleanCity_Real_Online.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract CleanCity project" || echo "Nothing to commit"
          git push
