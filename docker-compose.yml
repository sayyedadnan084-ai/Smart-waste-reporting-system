services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cleancity
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  tomcat:
    image: tomcat:10.1-jdk17
    depends_on: [mysql]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cleancity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
    volumes:
      - ./backend/target/cleancity.war:/usr/local/tomcat/webapps/cleancity.war:ro
volumes:
  mysql_data:
